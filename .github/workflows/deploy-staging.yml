# Deploy manual a STAGING por SSH.
# Secrets: STAGING_DEPLOY_HOST, STAGING_DEPLOY_USER, STAGING_DEPLOY_PRIVATE_KEY, STAGING_DEPLOY_PATH
# Opcional: STAGING_DEPLOY_PORT, STAGING_DEPLOY_HEALTH_URL
# Ver docs/DEPLOY-GITHUB.md

name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Rama a desplegar
        required: true
        default: develop
      run_migrations:
        description: Ejecutar migrate --force
        required: false
        type: boolean
        default: true

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  verify:
    name: Tests + build (pre-deploy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: dom, mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run tests
        run: php artisan test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm

      - name: Build frontend
        run: |
          npm ci
          npm run build
          test -f public/build/manifest.json

  deploy:
    name: Deploy SSH (staging)
    runs-on: ubuntu-latest
    needs: verify
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.2.0
        env:
          RUN_MIGRATIONS: ${{ inputs.run_migrations }}
          DEPLOY_BRANCH: ${{ inputs.branch }}
        with:
          host: ${{ secrets.STAGING_DEPLOY_HOST }}
          username: ${{ secrets.STAGING_DEPLOY_USER }}
          key: ${{ secrets.STAGING_DEPLOY_PRIVATE_KEY }}
          port: ${{ secrets.STAGING_DEPLOY_PORT }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.STAGING_DEPLOY_PATH }}"
            git fetch origin
            git checkout "$DEPLOY_BRANCH"
            git pull origin "$DEPLOY_BRANCH"
            export RUN_MIGRATIONS
            bash scripts/github-remote-deploy.sh

      - name: Health check (post-deploy)
        env:
          HEALTH_URL: ${{ secrets.STAGING_DEPLOY_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "STAGING_DEPLOY_HEALTH_URL no configurado; se omite verificación HTTP."
            exit 0
          fi
          sleep 10
          chmod +x scripts/verify-health.sh
          bash scripts/verify-health.sh "$HEALTH_URL"
