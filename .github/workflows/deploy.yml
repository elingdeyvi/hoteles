# Despliegue manual por SSH (producción).
# Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_PRIVATE_KEY, DEPLOY_PATH
# Opcional: DEPLOY_PORT, DEPLOY_HEALTH_URL
# Ver docs/DEPLOY-GITHUB.md

name: Deploy

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Rama a desplegar en el servidor
        required: true
        default: main
      run_migrations:
        description: Ejecutar php artisan migrate --force
        required: false
        type: boolean
        default: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: Tests + build (pre-deploy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: dom, mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run tests
        run: php artisan test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm

      - name: Build frontend
        run: |
          npm ci
          npm run build
          test -f public/build/manifest.json

  deploy:
    name: Deploy SSH (production)
    runs-on: ubuntu-latest
    needs: verify
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        env:
          RUN_MIGRATIONS: ${{ inputs.run_migrations }}
          DEPLOY_BRANCH: ${{ inputs.branch }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin
            git checkout "$DEPLOY_BRANCH"
            git pull origin "$DEPLOY_BRANCH"
            export RUN_MIGRATIONS
            bash scripts/github-remote-deploy.sh

      - name: Health check (post-deploy)
        env:
          HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "DEPLOY_HEALTH_URL no configurado; se omite verificación HTTP."
            exit 0
          fi
          echo "Esperando arranque (10s)..."
          sleep 10
          chmod +x scripts/verify-health.sh
          bash scripts/verify-health.sh "$HEALTH_URL"
